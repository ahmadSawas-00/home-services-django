<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة الخدمات</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="d-flex justify-content-between mb-4">
        <a href="/" class="btn btn-outline-secondary">🏠 الصفحة الرئيسية</a>
        <a href="{% url 'bookings-ui' %}" class="btn btn-outline-success">📊 استكشاف الحجوزات</a>
    </div>  
    <div class="container py-5">
        <h2 class="mb-4 text-center fw-bold">الخدمات المتاحة</h2>
        <div class="row g-4">
            {% for service in services %}
            <div class="col-md-4">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">{{ service.title }}</h5>
                        <p class="card-text text-muted">{{ service.description }}</p>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <span class="badge bg-success fs-6">{{ service.price }} ل.س</span>
                            <button class="btn btn-primary btn-sm">حجز الآن</button>
                        </div>
                    </div>
                </div>
            </div>
            {% empty %}
            <p class="text-center">لا توجد خدمات متاحة حالياً.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
