<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجوزاتي</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="d-flex justify-content-between mb-4">
    <a href="/" class="btn btn-outline-secondary">🏠 الصفحة الرئيسية</a>
    <a href="{% url 'services-ui' %}" class="btn btn-outline-primary">⚡ استكشاف الخدمات</a>
</div>

    <div class="container py-5">
        <h2 class="mb-4 text-center fw-bold">قائمة حجوزاتي</h2>
        <div class="row g-3">
            {% for booking in bookings %}
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-3">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="fw-bold mb-0">{{ booking.service.title }}</h5>
                            <span class="badge {% if booking.status == 'pending' %}bg-warning text-dark{% elif booking.status == 'accepted' %}bg-success{% else %}bg-secondary{% endif %}">
                                {{ booking.get_status_display }}
                            </span>
                        </div>
                        <p class="text-muted mb-1"><strong>العنوان:</strong> {{ booking.address }}</p>
                        <small class="text-muted">تاريخ الطلب: {{ booking.created_at|date:"Y-m-d H:i" }}</small>
                    </div>
                </div>
            </div>
            {% empty %}
            <p class="text-center text-muted">لا توجد لديك حجوزات حالية.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
